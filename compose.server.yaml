# Server-mode overlay: PostgreSQL persistence + sign-in + collaboration.
#
# Layer it on top of the base file; never use it alone:
#
#   docker compose -f compose.yaml -f compose.server.yaml -p acgraph-foundation up -d --build --wait
#
# Required in the shell or in --env-file .env.local: POSTGRES_PASSWORD and APP_URL.
# People then sign in with an e-mail and a password kept in that database; the
# sign-in page creates accounts until AUTH_SIGNUP=closed (then: `npm run users`).
# Optional: OIDC_ISSUER + OIDC_CLIENT_ID (+ OIDC_CLIENT_SECRET) switch the login
# to the company's identity provider instead — see docs/AUTHENTIK.md.

services:
  app:
    environment:
      # The app talks to the Compose-internal postgres service, never to a published port.
      DATABASE_URL: postgres://acgraph:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in server mode}@postgres:5432/acgraph
      APP_URL: ${APP_URL:?APP_URL is required in server mode}
      AUTH_SIGNUP: ${AUTH_SIGNUP:-open}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # In server mode the database is not optional: drop the profile so it always starts.
    profiles: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in server mode}
    restart: unless-stopped
