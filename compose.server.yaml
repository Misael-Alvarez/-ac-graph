# Server-mode overlay: PostgreSQL persistence + Authentik login + collaboration.
#
# Layer it on top of the base file; never use it alone:
#
#   docker compose -f compose.yaml -f compose.server.yaml -p acgraph-foundation up -d --build --wait
#
# Required in the shell or in --env-file .env.local: POSTGRES_PASSWORD, OIDC_ISSUER,
# OIDC_CLIENT_ID, APP_URL. OIDC_CLIENT_SECRET is optional (public client + PKCE).
# See docs/AUTHENTIK.md for the provider set-up.

services:
  app:
    environment:
      # The app talks to the Compose-internal postgres service, never to a published port.
      DATABASE_URL: postgres://acgraph:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in server mode}@postgres:5432/acgraph
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required in server mode}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required in server mode}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:?APP_URL is required in server mode}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # In server mode the database is not optional: drop the profile so it always starts.
    profiles: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in server mode}
    restart: unless-stopped
