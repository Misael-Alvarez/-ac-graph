name: acgraph-foundation

services:
  app:
    image: acgraph-foundation:local
    build:
      context: .
      target: runner
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-3080}:3000'
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Future backend sandbox ONLY. The app has no database connection or dependency.
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    profiles: [postgres]
    environment:
      POSTGRES_DB: acgraph
      POSTGRES_USER: acgraph
      # Empty by default: the official entrypoint refuses first initialization.
      # A :? interpolation here would also break app-only Compose commands.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

volumes:
  postgres-data:
